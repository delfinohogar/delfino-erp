<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ingresar — Delfino ERP</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="login-page">
      <div class="card login-card">
        <h1>Delfino ERP</h1>
        <p class="hint">Ingresá con tu cuenta para continuar.</p>
        <form id="login-form">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="username" />
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" required autocomplete="current-password" />
          </div>
          <button type="submit" class="primary" id="submit-btn">Ingresar</button>
          <p class="error-text hidden" id="error-text"></p>
        </form>
      </div>
    </div>

    <script type="module">
      import { auth, signInWithEmailAndPassword } from "/js/firebase.js";

      const params = new URLSearchParams(location.search);
      const errorText = document.getElementById("error-text");
      if (params.get("error") === "sin-perfil") {
        errorText.textContent = "Tu usuario no tiene un perfil asignado en el sistema. Pedile a un administrador que lo cree.";
        errorText.classList.remove("hidden");
      }

      document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById("submit-btn");
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        submitBtn.disabled = true;
        submitBtn.textContent = "Ingresando…";
        errorText.classList.add("hidden");
        try {
          await signInWithEmailAndPassword(auth, email, password);
          const next = params.get("next") || "/dashboard.html";
          location.href = next;
        } catch (err) {
          errorText.textContent = "Email o contraseña incorrectos.";
          errorText.classList.remove("hidden");
          submitBtn.disabled = false;
          submitBtn.textContent = "Ingresar";
        }
      });
    </script>
  </body>
</html>
