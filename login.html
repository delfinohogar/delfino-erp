<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ingresar — Delfino ERP</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="login-page">
      <div class="card login-card">
        <h1>Delfino ERP</h1>
        <p class="hint">Ingresá con tu cuenta para continuar.</p>
        <form id="login-form">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="username" />
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" required autocomplete="current-password" />
          </div>
          <button type="submit" class="primary" id="submit-btn">Ingresar</button>
          <p class="error-text hidden" id="error-text"></p>
        </form>
      </div>
    </div>

    <script type="module" src="/dist/login.js"></script>
  </body>
</html>
